spring.application.name=DeliveryOfRolls

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

app.email.admin=redrolls@yandex.ru

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.check-template-location=true

# Spring MVC - HTTP
spring.mvc.hiddenmethod.filter.enabled=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.devtools.restart.enabled=true

# Session 30 days
server.servlet.session.timeout=2592000


spring.cache.type=simple
spring.cache.cache-names=categories,dishes,promotions,dashboard,orders

server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,image/png,image/jpeg

spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.cache.cachecontrol.cache-public=true

spring.mail.host=smtp.yandex.ru
spring.mail.port=465
spring.mail.username=redrolls@yandex.ru
spring.mail.password=kiazrjxtmsvvfrlm
spring.mail.protocol=smtps

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.yandex.ru

# Server
server.port=8081

# HTTPS Configuration (Let's Encrypt)
server.ssl.enabled=false
