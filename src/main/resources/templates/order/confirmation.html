<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: html(content=~{::main})}">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Заказ оформлен</title>
</head>
<body>
<main>
    <div class="success-wrapper">

        <!-- Иконка успеха -->
        <div class="success-icon">
            <i class="bi bi-check-lg"></i>
        </div>

        <h1>Спасибо за заказ!</h1>
        <p class="subtitle">Ваш заказ успешно оформлен</p>

        <!-- Информация о заказе -->
        <div class="order-card" th:if="${order}">
            <div class="card-header">
                <i class="bi bi-receipt"></i> Заказ #[[${order.id}]]
            </div>

            <div class="card-body">
                <!-- Статус -->
                <div class="status">
                    <i class="bi bi-clock-history"></i>
                    <span th:text="${order.status == 'PENDING' ? 'Ожидает подтверждения' : 'Подтвержден'}"></span>
                </div>

                <!-- Контактные данные -->
                <div class="info-grid">
                    <div class="info-item">
                        <small>Имя</small>
                        <span th:text="${order.customerName}">Иван</span>
                    </div>
                    <div class="info-item">
                        <small>Телефон</small>
                        <span th:text="${order.customerPhone}">+7 (999) 123-45-67</span>
                    </div>
                    <div class="info-item">
                        <small>Тип</small>
                        <span th:text="${order.deliveryType == 'DELIVERY' ? 'Доставка' : 'Самовывоз'}">Доставка</span>
                    </div>
                    <div class="info-item" th:if="${order.deliveryAddress}">
                        <small>Адрес</small>
                        <span th:text="${order.deliveryAddress}">ул. Пушкина</span>
                    </div>
                </div>

                <!-- Состав заказа -->
                <table class="items-table">
                    <thead>
                    <tr>
                        <th>Товар</th>
                        <th>Кол-во</th>
                        <th>Сумма</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${order.items}">
                        <td th:text="${item.dishName}">Филадельфия</td>
                        <td th:text="${item.quantity}">2</td>
                        <td th:text="${#numbers.formatDecimal(item.totalPrice, 0, 0)} + ' ₽'">700 ₽</td>
                    </tr>
                    </tbody>
                </table>

                <!-- Итого -->
                <div class="total-row">
                    <span>Итого:</span>
                    <span th:text="${#numbers.formatDecimal(order.totalPrice, 0, 0)} + ' ₽'">1 250 ₽</span>
                </div>

                <!-- Способ оплаты -->
                <div class="info-item" style="margin: 10px 0;">
                    <small>Оплата</small>
                    <span th:text="${order.paymentMethod == 'CASH' ? 'Наличными' :
                                    order.paymentMethod == 'CARD_ON_DELIVERY' ? 'Картой при получении' :
                                    'Картой онлайн'}">
                        Наличными
                    </span>
                </div>

                <!-- Комментарий (если есть) -->
                <div class="info-item" th:if="${order.notes}" style="margin-top: 10px;">
                    <small>Комментарий</small>
                    <span th:text="${order.notes}">Позвонить за 10 минут</span>
                </div>

                <!-- Кнопки -->
                <div class="btn-group">
                    <a th:href="@{/}" class="btn btn-primary">
                        <i class="bi bi-arrow-left"></i> В меню
                    </a>
                    <a th:href="@{/profile/orders}" class="btn btn-secondary" th:if="${order.user != null}">
                        <i class="bi bi-clock-history"></i> История
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
