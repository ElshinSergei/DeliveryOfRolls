
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технические работы</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #fff5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message {
            text-align: center;
            padding: 40px 20px;
            max-width: 400px;
        }

        .message i {
            font-size: 70px;
            color: #e74c3c;
            margin-bottom: 20px;
        }

        .message h2 {
            font-size: 26px;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .message p {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        .message a {
            display: inline-block;
            padding: 12px 30px;
            background: #e74c3c;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 500;
            transition: 0.3s;
        }

        .message a:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="message">
    <i class="bi bi-gear"></i>
    <h2>Технические работы</h2>
    <p>Временно недоступно. Скоро всё заработает!</p>
    <a th:href="@{/home}">Вернуться на главную</a>
</div>
</body>
</html>
