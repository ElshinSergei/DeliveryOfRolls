<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: html(content=~{::main})}">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Управление категориями</title>
</head>
<body>
<main>
    <div class="admin-container">

        <!-- Заголовок -->
        <div class="admin-header">
            <h3>📁 Управление категориями</h3>
            <a th:href="@{/admin/categories/new}" class="btn-minimal btn-minimal-primary"
               style="padding: 10px 20px; font-size: 14px; width: auto; display: inline-flex;">
                <i class="bi bi-person-plus"></i> Добавить категорию
            </a>
        </div>

        <!-- Сообщения -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Проверка наличия категорий -->
        <div th:if="${categories == null or categories.isEmpty()}" class="empty-state">
            <i class="bi bi-folder display-1 text-muted"></i>
            <h3 class="mt-3 text-muted">Категорий пока нет</h3>
            <a href="/admin/categories/new" class="btn btn-primary mt-3">
                ➕ Создать первую категорию
            </a>
        </div>

        <!-- Таблица категорий -->
        <div th:if="${categories != null and not categories.isEmpty()}">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Описание</th>
                    <th class="text-center">Блюд</th>
                    <th class="text-center">Позиция</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cat : ${categories}" th:id="|category-${cat.id}|">
                    <td>
                        <strong>#[[${cat.id}]]</strong>
                    </td>
                    <td>
                        <strong th:text="${cat.name}">Роллы</strong>
                    </td>
                    <td>
                        <span class="dish-description" th:text="${cat.description != null ? cat.description : '—'}">
                            Описание
                        </span>
                    </td>
                    <td class="text-center">
                        <span class="count-badge" th:text="${cat.dishes != null ? cat.dishes.size() : 0}">5</span>
                    </td>
                    <td class="text-center">
                        <span class="sort-badge" th:text="${cat.sortOrder != null ? cat.sortOrder : '0'}">1</span>
                    </td>
                    <td>
                        <div class="btn-group">
                            <!-- Кнопка редактирования -->
                            <a th:href="@{/admin/categories/{id}/edit(id=${cat.id})}"
                               class="btn-edit" title="Редактировать">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <!-- Кнопка переключения доступности -->
                            <form th:action="@{/admin/categories/{id}/toggle(id=${cat.id})}"
                                  method="post" style="display: inline;">
                                <button type="submit" class="btn-toggle"
                                        th:title="${cat.available} ? 'Скрыть' : 'Показать'">
                                    <i th:if="${cat.available}" class="bi bi-eye-slash"></i>
                                    <i th:unless="${cat.available}" class="bi bi-eye"></i>
                                </button>
                            </form>
                            <!-- Кнопка удаления -->
                            <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}"
                                  method="post" style="display: inline;">
                                <button type="submit" class="btn-delete"
                                        onclick="return confirm('Удалить категорию?');"
                                        title="Удалить">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
