<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: html(content=~{::main})}">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Редактирование категории</title>
</head>
<body>
<main>
    <div class="form-container">
        <!-- Заголовок -->
        <div class="form-header">
            <h2 th:text="${category.id == null} ? '➕ Добавление категории' : '✏️ Редактирование категории'">
                Добавление категории
            </h2>
            <a th:href="@{/admin/categories}" class="btn btn-secondary">← Назад</a>
        </div>

        <!-- Форма -->
        <form th:action="@{/admin/categories/save}" method="post" th:object="${category}">
            <!-- ID (только для редактирования) -->
            <input type="hidden" name="id" th:value="${category.id}">

            <!-- Название категории -->
            <div class="form-group">
                <label for="name">Название категории *</label>
                <input type="text" id="name" class="form-control" th:field="*{name}"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                       placeholder="Например: Роллы, Суши, Сеты" required>
                <div th:if="${#fields.hasErrors('name')}"
                     th:errors="*{name}" class="invalid-feedback"></div>
                <small class="form-text">Отображается в меню и на карточках блюд</small>
            </div>

            <!-- Описание категории -->
            <div class="form-group">
                <label for="description">Описание</label>
                <textarea id="description" class="form-control" th:field="*{description}"
                          rows="3" placeholder="Краткое описание категории..."></textarea>
                <small class="form-text">Необязательное поле. Будет отображаться в меню</small>
            </div>

            <!-- Порядок сортировки -->
            <div class="form-group">
                <label for="sortOrder">Порядок сортировки</label>
                <input type="number" id="sortOrder" class="form-control" th:field="*{sortOrder}"
                       min="0" value="0">
                <small class="form-text">Чем меньше число, тем выше в списке</small>
            </div>

            <div class="form-group">
                <label class="d-block">Доступность</label>
                <div class="form-check form-switch">
                    <input type="checkbox"
                           class="form-check-input"
                           id="available"
                           name="available"
                           th:checked="${category.available}"
                           value="true">
                    <label class="form-check-label" for="available">
                        Категория доступна в меню
                    </label>
                </div>
                <small class="form-text">Если выключить, категория не будет показываться на сайте</small>
            </div>

            <!-- Кнопки -->
            <div class="form-actions" style="display: flex; gap: 10px; margin-top: 30px;">
                <button type="submit" class="btn btn-primary">
                    💾 Сохранить
                </button>
                <a th:href="@{/admin/categories}" class="btn btn-secondary">
                    Отмена
                </a>
            </div>
                </form>
            </div>
</main>
</body>
</html>
