<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: html(content=~{::main})}">
<head>
    <title th:text="${pageTitle}">Добавление блюда</title>
</head>
<body>
<main>
    <div class="dish-form-container">

        <!-- Заголовок в стиле пользователей -->
        <div class="dish-header-minimal">
            <div>
                <h1 th:text="${dish.id == null} ? '🍣 Добавление блюда' : '✏️ Редактирование блюда'">
                    Добавление блюда
                </h1>
                <div class="subtitle" th:text="${dish.id == null} ?
                    'Добавьте новое блюдо в меню' :
                    'Измените параметры блюда'">
                    Добавьте новое блюдо в меню
                </div>
            </div>
            <a th:href="@{/admin/dishes}" class="btn-minimal btn-minimal-outline">
                ← Назад
            </a>
        </div>

        <!-- Сообщения об ошибках -->
        <div th:if="${error}" class="alert alert-danger" style="margin-bottom: 20px;">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}">Ошибка</span>
        </div>

        <!-- Форма -->
        <div class="edit-card">
            <form th:action="@{/admin/dishes/save}" method="post"
                  th:object="${dish}"
                  enctype="multipart/form-data">

                <input type="hidden" name="id" th:value="${dish.id}">

                <div class="row">
                    <!-- Левая колонка - поля формы -->
                    <div class="col-md-8">
                        <!-- Название блюда -->
                        <div class="form-group">
                            <label class="form-label">
                                <i class="bi bi-tag"></i> Название блюда <span class="text-danger">*</span>
                            </label>
                            <input type="text" th:field="*{name}" class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                   placeholder="Филадельфия" required>
                            <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback" th:errors="*{name}"></div>
                        </div>

                        <!-- Описание -->
                        <div class="form-group">
                            <label class="form-label">
                                <i class="bi bi-text-paragraph"></i> Описание
                            </label>
                            <textarea th:field="*{description}" class="form-control"
                                      rows="3" placeholder="Описание блюда..."></textarea>
                        </div>

                        <!-- Цена и вес -->
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        <i class="bi bi-currency-ruble"></i> Цена (₽) <span class="text-danger">*</span>
                                    </label>
                                    <input th:field="*{price}" type="number" class="form-control"
                                           th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                                           step="1" required>
                                    <div th:if="${#fields.hasErrors('price')}" class="invalid-feedback" th:errors="*{price}"></div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        <i class="bi bi-circle"></i> Вес (г) <span class="text-danger">*</span>
                                    </label>
                                    <input th:field="*{weight}" type="number" class="form-control"
                                           th:classappend="${#fields.hasErrors('weight')} ? 'is-invalid' : ''"
                                           required>
                                    <div th:if="${#fields.hasErrors('weight')}" class="invalid-feedback" th:errors="*{weight}"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Калории и категория -->
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        <i class="bi bi-fire"></i> Калории (ккал)
                                    </label>
                                    <input th:field="*{calories}" type="number" class="form-control"
                                           th:classappend="${#fields.hasErrors('calories')} ? 'is-invalid' : ''">
                                    <div th:if="${#fields.hasErrors('calories')}" class="invalid-feedback" th:errors="*{calories}"></div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label class="form-label">
                                        <i class="bi bi-folder"></i> Категория <span class="text-danger">*</span>
                                    </label>
                                    <select th:field="*{category.id}" class="form-select" required>
                                        <option value="">-- Выберите категорию --</option>
                                        <option th:each="cat : ${categories}"
                                                th:value="${cat.id}"
                                                th:text="${cat.name}"
                                                th:selected="${dish.category != null and dish.category.id == cat.id}">
                                        </option>
                                    </select>
                                    <div th:if="${#fields.hasErrors('category.id')}" class="invalid-feedback" th:errors="*{category.id}"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Ингредиенты -->
                        <div class="form-group">
                            <label class="form-label">
                                <i class="bi bi-basket"></i> Ингредиенты
                            </label>
                            <input type="text" class="form-control"
                                   name="ingredientsString"
                                   th:value="${dish.ingredients != null ?
                                             #strings.listJoin(dish.ingredients, ', ') : ''}"
                                   placeholder="лосось, сыр, огурец">
                            <div class="form-text">Введите через запятую</div>
                        </div>

                        <!-- Доступность -->
                        <div class="checkbox-group">
                            <input type="checkbox" th:field="*{available}" id="available">
                            <label for="available">Доступно для заказа</label>
                        </div>
                    </div>

                    <!-- Правая колонка - изображение -->
                    <div class="col-md-4">
                        <div class="image-card">
                            <label class="form-label">
                                <i class="bi bi-image"></i> Изображение блюда
                            </label>

                            <!-- Превью текущего изображения -->
                            <div th:if="${dish.imageUrl != null}" class="current-image">
                                <img th:src="@{${dish.imageUrl}}" alt="Превью">
                                <p class="text-muted small mt-2">Текущее изображение</p>
                            </div>

                            <!-- Загрузка нового файла -->
                            <div class="form-group">
                                <input type="file" name="imageFile" class="form-control"
                                       accept="image/*">
                            </div>

                            <!-- Рекомендации -->
                            <div class="image-hint">
                                <i class="bi bi-lightbulb me-1"></i>
                                <strong>Рекомендации:</strong>
                                <ul class="mt-2 mb-0 ps-3">
                                    <li>Макс. размер: 5MB</li>
                                    <li>Форматы: JPG, PNG, WebP</li>
                                    <li>Размер: 1200x1000px</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Кнопки действий -->
                <div class="action-bar-minimal">
                    <a th:href="@{/admin/dishes}" class="btn-minimal btn-minimal-outline">
                        <i class="bi bi-x-circle"></i> Отмена
                    </a>
                    <button type="submit" class="btn-minimal btn-minimal-primary">
                        <i class="bi bi-check-circle"></i> Сохранить блюдо
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
