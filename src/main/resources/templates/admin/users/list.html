<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: html(content=~{::main})}">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Управление пользователями</title>
</head>
<body>
<main>
    <div class="admin-container">

        <!-- Заголовок -->
        <div class="admin-header">
            <h3>👥 Управление пользователями</h3>
        </div>

        <!-- Сообщения -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Блок фильтрации -->
        <div class="filters-bar">
            <form method="get" th:action="@{/admin/users}" style="display: flex; flex-wrap: wrap; gap: 10px; flex: 1; align-items: center;">
                <!-- Поиск -->
                <div class="filter-item">
                    <i class="bi bi-search"></i>
                    <input type="text" name="search" th:value="${searchQuery}"
                           placeholder="Поиск по email, имени, телефону...">
                </div>

                <!-- Фильтр по роли -->
                <div class="filter-item">
                    <i class="bi bi-shield"></i>
                    <select name="role">
                        <option value="">Все роли</option>
                        <option value="ROLE_USER" th:selected="${selectedRole == 'ROLE_USER'}">Пользователь</option>
                        <option value="ROLE_ADMIN" th:selected="${selectedRole == 'ROLE_ADMIN'}">Администратор</option>
                    </select>
                </div>

                <!-- Фильтр по статусу -->
                <div class="filter-item">
                    <i class="bi bi-toggle-on"></i>
                    <select name="enabled">
                        <option value="">Все</option>
                        <option value="true" th:selected="${selectedStatus == true}">✅ Активные</option>
                        <option value="false" th:selected="${selectedStatus == false}">❌ Заблокированные</option>
                    </select>
                </div>

                <!-- Кнопки действий -->
                <div class="filter-actions">
                    <button type="submit" class="filter-submit">
                        <i class="bi bi-check-lg"></i> Применить
                    </button>
                    <a th:href="@{/admin/users}" class="filter-reset">
                        <i class="bi bi-x-lg"></i> Сброс
                    </a>
                </div>
            </form>
        </div>

        <!-- Проверка наличия пользователей -->
        <div th:if="${users == null or users.isEmpty()}" class="empty-state">
            <i class="bi bi-people display-1 text-muted"></i>
            <h3 class="mt-3 text-muted">Пользователей пока нет</h3>
        </div>

        <!-- Таблица пользователей -->
        <div th:if="${users != null and not users.isEmpty()}">
            <table class="table">
                <thead>
                <tr>
                    <th class="text-center">Id</th>
                    <th>
                        <a th:href="@{${baseUrl}(page=${users.number}, size=${users.size},
                            sort='firstName,' + ${currentSortField == 'firstName' ? reverseSortDir : 'asc'},
                            search=${searchQuery}, role=${selectedRole}, enabled=${selectedStatus})}"
                           class="sort-header" th:classappend="${currentSortField == 'firstName'} ? 'active' : ''">
                            Имя
                            <span th:if="${currentSortField == 'firstName'}" class="sort-icon">
                                <span th:if="${currentSortDir == 'asc'}">↑</span>
                                <span th:if="${currentSortDir == 'desc'}">↓</span>
                            </span>
                        </a>
                    </th>
                    <th>Email</th>
                    <th class="text-center">Телефон</th>
                    <th class="text-center">Роль</th>
                    <th class="text-center">Статус</th>
                    <th class="text-center">Заказов</th>
                    <th>
                        <a th:href="@{${baseUrl}(page=${users.number}, size=${users.size},
                            sort='registeredAt,' + ${currentSortField == 'registeredAt' ? reverseSortDir : 'asc'},
                            search=${searchQuery}, role=${selectedRole}, enabled=${selectedStatus})}"
                           class="sort-header" th:classappend="${currentSortField == 'registeredAt'} ? 'active' : ''">
                            Дата
                            <span th:if="${currentSortField == 'registeredAt'}" class="sort-icon">
                                <span th:if="${currentSortDir == 'asc'}">↑</span>
                                <span th:if="${currentSortDir == 'desc'}">↓</span>
                            </span>
                        </a>
                    </th>
                    <th class="text-center">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users.content}" th:id="|user-${user.id}|">
                    <td>
                        <strong>#[[${user.id}]]</strong>
                    </td>
                    <td>
                        <span th:text="${user.firstName + ' ' + user.lastName}">Иван Иванов</span>
                    </td>
                    <td th:text="${user.email}">ivan@mail.com</td>
                    <td th:text="${user.phone != null ? user.phone : '—'}">+7 (999) 123-45-67</td>
                    <td class="text-center">
                        <span th:if="${user.role.name() == 'ROLE_ADMIN'}" class="role-badge role-admin"
                              th:text="${user.role.name().replace('ROLE_', '')}">ADMIN</span>
                        <span th:if="${user.role.name() == 'ROLE_USER'}" class="role-badge role-user"
                              th:text="${user.role.name().replace('ROLE_', '')}">USER</span>
                    </td>
                    <td class="text-center">
                        <span th:if="${user.enabled}" class="status-active">Активен</span>
                        <span th:if="${!user.enabled}" class="status-blocked">Заблокирован</span>
                    </td>
                    <td class="text-center">
                        <span class="count-badge" th:text="${user.orders != null ? user.orders.size() : 0}">5</span>
                    </td>
                    <td>
                        <span th:text="${#temporals.format(user.registeredAt, 'dd.MM.yyyy')}">01.01.2024</span>
                    </td>
                    <td>
                        <div class="btn-group">
                            <a th:href="@{/admin/users/{id}(id=${user.id})}"
                               class="btn-view" title="Просмотр">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/admin/users/{id}/edit(id=${user.id})}"
                               class="btn-edit" title="Редактировать">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/users/{id}/toggle-status(id=${user.id})}"
                                  method="post" style="display: inline;">
                                <button type="submit" class="btn-toggle"
                                        th:title="${user.enabled} ? 'Заблокировать' : 'Разблокировать'">
                                    <i th:if="${user.enabled}" class="bi bi-lock"></i>
                                    <i th:unless="${user.enabled}" class="bi bi-unlock"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- Пагинация -->
            <div th:insert="~{admin/users/pagination :: pagination(${users}, ${baseUrl},
                ${searchQuery}, ${selectedRole}, ${selectedStatus})}">
            </div>

        </div>
    </div>
</main>
</body>
</html>
