<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: html(content=~{::main})}">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Редактирование пользователя</title>
</head>
<body>
<main>
    <div class="user-edit-container">

        <!-- Заголовок -->
        <div class="user-header-minimal">
            <h1>✏️ Редактирование пользователя</h1>
            <a th:href="@{/admin/users}" class="btn-minimal btn-minimal-outline">
                ← Назад
            </a>
        </div>

        <!-- Форма редактирования -->
        <form th:action="@{/admin/users/{id}/save(id=${user.id})}" method="post" class="edit-card">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <!-- Информация для чтения (не редактируется) -->
            <div class="readonly-info">
                <p><strong>Имя:</strong> <span th:text="${user.firstName + ' ' + user.lastName}">Иван Иванов</span></p>
                <p><strong>Email:</strong> <span th:text="${user.email}">ivan@mail.com</span></p>
                <p><strong>Телефон:</strong> <span th:text="${user.phone != null ? user.phone : '—'}">+7 (999) 123-45-67</span></p>
            </div>

            <!-- Роль -->
            <div class="form-group">
                <label>👤 Роль</label>
                <select name="role" class="form-control">
                    <option th:each="role : ${roles}"
                            th:value="${role}"
                            th:text="${role.name().replace('ROLE_', '')}"
                            th:selected="${role == user.role}">
                    </option>
                </select>
                <div class="text-muted">Выберите роль пользователя в системе</div>
            </div>

            <!-- Статус (чекбокс) -->
            <div class="form-group checkbox-group">
                <input type="checkbox" name="enabled" id="enabled" th:checked="${user.enabled}">
                <label for="enabled">✅ Активен (пользователь не заблокирован)</label>
            </div>

            <!-- Кнопки действий -->
            <div class="action-bar-minimal">
                <a th:href="@{/admin/users}" class="btn-minimal btn-minimal-outline" style="flex: 1; justify-content: center;">
                    Отмена
                </a>
                <button type="submit" class="btn-minimal btn-minimal-primary" style="flex: 2;">
                    💾 Сохранить изменения
                </button>
            </div>
        </form>

        <!-- Подсказка -->
        <div style="text-align: center; color: #a0aec0; font-size: 12px; margin-top: 20px;">
            <i class="bi bi-info-circle"></i>
            Имя, email и телефон можно изменить только через профиль пользователя
        </div>
    </div>
</main>
</body>
</html>
