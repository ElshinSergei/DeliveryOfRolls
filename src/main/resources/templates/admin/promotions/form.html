<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: html(content=~{::main})}">
<head>
    <title>Добавление акции</title>
</head>
<body>
<main>
    <div class="admin-container">
        <div class="admin-header">
            <h3 th:text="${promotion.id == null} ? '📢 Добавление акции' : '✏️ Редактирование акции'"></h3>
            <a th:href="@{/admin/promotions}" class="btn btn-secondary">← Назад</a>
        </div>

        <!-- Сообщения об успехе/ошибке -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}">Ошибка</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/admin/promotions/save}"
              th:object="${promotion}"
              method="post" enctype="multipart/form-data">

            <input type="hidden" name="id" th:value="*{id}">

            <div class="card shadow-sm p-4">

                <div class="mb-3">
                    <label class="form-label">Название акции</label>
                    <input type="text"
                           th:field="*{title}"
                           name="title" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Подробное описание акции</label>
                    <textarea th:field="*{description}"
                              class="form-control"
                              rows="10"
                              required
                              maxlength="500"
                              placeholder="Опишите условия акции, сроки действия, особые предложения..."></textarea>
                    <div class="form-text">Максимум 500 символов. Сейчас: <span id="charCount">0</span>/500</div>
                </div>

                <!-- Текущее изображение (только для редактирования) -->
                <div th:if="${promotion.id != null and promotion.imageUrl != null}" class="mb-4 text-center">
                    <label class="form-label fw-bold">Текущее изображение</label>
                    <div class="current-image-preview">
                        <img th:src="@{*{imageUrl}}"
                             alt="Превью"
                             style="max-width: 300px; max-height: 250px; border-radius: 8px; border: 1px solid #dee2e6; padding: 4px;">
                    </div>
                    <p class="text-muted small mt-2">Оставьте поле ниже пустым, чтобы не менять изображение</p>
                </div>

                <div class="mb-3">
                    <label class="form-label">Изображение акции
                        <span th:if="${promotion.id == null}" class="text-danger">*</span>
                        <span th:if="${promotion.id != null}" class="text-muted">(необязательно)</span>
                    </label>
                    <input type="file" name="imageFile" class="form-control" accept="image/*"
                           th:required="${promotion.id == null}">
                    <div class="form-text">Рекомендуемый размер: 1000x720px. Максимум 5MB.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Порядок сортировки</label>
                    <input type="number"
                           th:field="*{sortOrder}"
                           class="form-control"
                           min="0"
                           placeholder="0 - первый, 1 - второй и т.д.">
                    <div class="form-text">Чем меньше число, тем выше акция в списке</div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" th:field="*{active}" class="form-check-input" checked>
                    <label class="form-check-label">Активно</label>
                </div>

                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>

    <script>
        // Счетчик символов
        document.querySelector('textarea[name="description"]').addEventListener('input', function() {
            document.getElementById('charCount').textContent = this.value.length;
        });
    </script>

</main>
</body>
</html>
