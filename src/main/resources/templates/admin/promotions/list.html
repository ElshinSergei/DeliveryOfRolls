<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin-layout :: html(content=~{::main})}">
<head>
    <title>Управление акциями</title>
</head>
<body>
<main>
    <div class="container-fluid py-4">

        <!-- Заголовок -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-semibold mb-1">📢 Управление акциями</h3>
                <p class="text-muted small mb-0">
                    Всего акций: <span th:text="${#lists.size(promotions)}">0</span>
                </p>
            </div>
            <a th:href="@{/admin/promotions/new}" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i>Добавить акцию
            </a>
        </div>

        <!-- Сообщения -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Ошибка</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Список акций -->
        <div class="promo-list">
            <div th:each="promo, iterStat : ${promotions}" class="promo-item">
                <!-- ЕДИНСТВЕННЫЙ номер - круглый бейдж -->
                <div class="promo-sort">
                    <span class="sort-order-badge" th:text="${iterStat.index + 1}">1</span>
                </div>

                <!-- Изображение -->
                <img th:src="@{${promo.imageUrl}}" class="promo-image" th:alt="${promo.title}">

                <!-- Контент -->
                <div class="promo-content">
                    <div class="promo-header">
                        <h4 class="promo-title" th:text="${promo.title}">Название акции</h4>
                        <div class="promo-right">
                    <span class="promo-badge"
                          th:classappend="${promo.active} ? 'active' : 'inactive'"
                          th:text="${promo.active} ? 'Активно' : 'Неактивно'">
                        Активно
                    </span>
                        </div>
                    </div>

                    <div class="promo-description" th:text="${promo.description} ?: 'Описание отсутствует'">
                        Описание...
                    </div>

                    <div class="promo-actions">
                        <a th:href="@{/admin/promotions/{id}/edit(id=${promo.id})}" class="btn-edit">
                            <i class="bi bi-pencil"></i> Редактировать
                        </a>
                        <form th:action="@{/admin/promotions/{id}/delete(id=${promo.id})}" method="post">
                            <button type="submit" class="btn-delete" onclick="return confirm('Удалить акцию?')">
                                <i class="bi bi-trash"></i> Удалить
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Пустое состояние -->
        <div th:if="${promotions.isEmpty()}" class="text-center py-5">
            <div class="py-5">
                <i class="bi bi-megaphone display-1 text-muted" style="font-size: 80px;"></i>
                <h4 class="mt-3 text-muted">Акций пока нет</h4>
                <p class="text-muted mb-4">Добавьте первую акцию</p>
                <a th:href="@{/admin/promotions/new}" class="btn btn-primary btn-lg">
                    <i class="bi bi-plus-circle me-2"></i>Создать первую акцию
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
