<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="html(content)">
<head>
    <meta charset="UTF-8">
    <meta name="context-path" th:content="${contextPath}"/>
    <title th:text="${pageTitle}">Доставка суши</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">

    <!-- СПЕЦИФИЧНЫЕ стили для страницы -->
    <th:block th:if="${pageCss != null}">
        <link rel="stylesheet" th:href="@{|/css/${pageCss}|}">
    </th:block>

</head>

<body>

<header style="background: #343a40; color: white; padding: 15px 0;">
    <div style="max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 40px;">
            <h2 style="margin: 0; font-size: 24px;">🍣 RedRolls</h2>
            <nav style="display: flex; gap: 20px;">
                <a th:href="@{/admin}"
                   style="color: white; text-decoration: none; padding: 5px 10px; border-radius: 5px;">
                    📊 Главная
                </a>
                <a th:href="@{/admin/orders}"
                   style="color: white; text-decoration: none; padding: 5px 10px; border-radius: 5px;">
                    📦 Заказы
                </a>
                <a th:href="@{/admin/dishes}"
                   style="color: white; text-decoration: none; padding: 5px 10px; border-radius: 5px;">
                    🍣 Меню
                </a>
                <a th:href="@{/admin/categories}"
                   style="color: white; text-decoration: none; padding: 5px 10px; border-radius: 5px;">
                    📁 Категории
                </a>
                <a th:href="@{/admin/users}"
                   style="color: white; text-decoration: none; padding: 5px 10px; border-radius: 5px;">
                    👥 Пользователи
                </a>
                <a th:href="@{/admin/promotions}"
                   style="color: white; text-decoration: none; padding: 5px 10px; border-radius: 5px;">
                    📢 Акции
                </a>
            </nav>
        </div>
        <div>
            <span style="margin-right: 20px;" th:text="${#authentication.name}">admin</span>
            <a th:href="@{/home}" style="color: white; text-decoration: none;" target="_blank">🌐 На сайт</a>
            <form th:action="@{/logout}" method="post" style="display: inline; margin-left: 15px;">
                <button type="submit" style="background: #dc3545; color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer;">Выйти</button>
            </form>
        </div>
    </div>
</header>


<main style="max-width: 1400px; margin: 30px auto; padding: 0 20px;">
    <div th:replace="${content}"></div>
</main>


<footer style="background: #f8f9fa; padding: 20px 0; margin-top: 50px;">
    <div style="max-width: 1400px; margin: 0 auto; padding: 0 20px; text-align: center; color: #6c757d;">
        <p>© 2026 RedRolls. Панель администратора</p>
    </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
