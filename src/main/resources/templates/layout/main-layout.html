<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="html(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta name="context-path" th:content="${contextPath}"/>
    <title th:text="${pageTitle}">Доставка суши</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/mobile-address-styles.css}">
    <link rel="stylesheet" th:href="@{/css/mobile-grid-fix.css}">
    <link rel="stylesheet" th:href="@{/css/mobile-menu-modern.css}">
    <link rel="stylesheet" th:href="@{/css/notifications.css}">
    <th:block th:if="${pageCss != null}">
        <link rel="stylesheet" th:href="@{|/css/${pageCss}|}">
    </th:block>

</head>
<body>

<div>
    <header th:replace="~{layout/header :: header}"></header>
</div>

<div>
    <main th:replace="${content}"></main>
</div>

<div>
    <footer th:replace="~{layout/footer :: footer}"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>

</body>
</html>
