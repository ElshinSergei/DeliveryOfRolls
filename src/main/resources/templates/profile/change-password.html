<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: html(content=~{::main})}">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Смена пароля</title>
</head>
<body>
<main>
    <div class="profile-wrapper">
        <div class="profile-card">
            <!-- Шапка профиля -->
            <div class="profile-header">
                <div class="profile-avatar">
                    <span>🔐</span>
                </div>
                <div class="profile-title">
                    <h1 th:text="${pageTitle}">Смена пароля</h1>
                    <p>Измените ваш пароль для входа в систему</p>
                </div>
            </div>

            <!-- Основной контент -->
            <div class="profile-layout">
                <!-- Боковое меню -->
                <div class="profile-menu">
                    <a th:href="@{/profile}" class="profile-menu-item">
                        <i class="bi bi-person"></i>
                        <span>Мой профиль</span>
                    </a>
                    <a th:href="@{/profile/orders}" class="profile-menu-item">
                        <i class="bi bi-box"></i>
                        <span>Мои заказы</span>
                    </a>
                    <a th:href="@{/profile/addresses}" class="profile-menu-item">
                        <i class="bi bi-geo-alt"></i>
                        <span>Мои адреса</span>
                    </a>
                    <a th:href="@{/profile/bonuses}" class="profile-menu-item">
                        <i class="bi bi-gem"></i>
                        <span>Мои бонусы</span>
                    </a>
                    <a th:href="@{/profile/change-password}" class="profile-menu-item active">
                        <i class="bi bi-key"></i>
                        <span>Сменить пароль</span>
                    </a>
                </div>

                <!-- Форма смены пароля -->
                <div class="profile-content">
                    <div class="content-header">
                        <h2>🔐 Смена пароля</h2>
                    </div>

                    <!-- Сообщения -->
                    <div th:if="${success}" class="alert alert-success">
                        <i class="bi bi-check-circle-fill"></i>
                        <span th:text="${success}"></span>
                    </div>
                    <div th:if="${error}" class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <!-- Форма -->
                    <form th:action="@{/profile/change-password}"
                          th:object="${changePasswordDTO}"
                          method="post"
                          class="profile-form">

                        <!-- Текущий пароль -->
                        <div class="form-group">
                            <label for="oldPassword">
                                <i class="bi bi-lock"></i>
                                Текущий пароль
                            </label>
                            <input type="password"
                                   id="oldPassword"
                                   th:field="*{oldPassword}"
                                   placeholder="Введите текущий пароль"
                                   required>
                            <div th:if="${#fields.hasErrors('oldPassword')}"
                                 th:errors="*{oldPassword}"
                                 class="error-message"></div>
                        </div>

                        <!-- Новый пароль -->
                        <div class="form-group">
                            <label for="newPassword">
                                <i class="bi bi-lock-fill"></i>
                                Новый пароль
                            </label>
                            <input type="password"
                                   id="newPassword"
                                   th:field="*{newPassword}"
                                   placeholder="Минимум 6 символов"
                                   required>
                            <small class="form-text text-muted">
                                Пароль должен содержать минимум 6 символов
                            </small>
                            <div th:if="${#fields.hasErrors('newPassword')}"
                                 th:errors="*{newPassword}"
                                 class="error-message"></div>
                        </div>

                        <!-- Подтверждение пароля -->
                        <div class="form-group">
                            <label for="confirmPassword">
                                <i class="bi bi-lock-fill"></i>
                                Подтвердите пароль
                            </label>
                            <input type="password"
                                   id="confirmPassword"
                                   th:field="*{confirmPassword}"
                                   placeholder="Введите пароль еще раз"
                                   required>
                            <div th:if="${#fields.hasErrors('confirmPassword')}"
                                 th:errors="*{confirmPassword}"
                                 class="error-message"></div>
                        </div>

                        <!-- Кнопки -->
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i>
                                Сохранить пароль
                            </button>
                            <a th:href="@{/profile}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i>
                                Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
