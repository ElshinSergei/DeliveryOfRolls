<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: html(content=~{::main})}">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">RedRolls - Главная</title>

</head>
<body>
<main>
    <div class="profile-wrapper">
        <div class="profile-card">
            <!-- Шапка профиля -->
            <div class="profile-header">
                <div class="profile-avatar">
                    <span>👤</span>
                </div>
                <div class="profile-title">
                    <h1 th:text="${user.firstName + ' ' + user.lastName}">Иван Иванов</h1>
                    <p th:text="${user.email}">ivan@mail.com</p>
                </div>
            </div>

            <!-- Основной контент -->
            <div class="profile-layout">
                <!-- Боковое меню -->
                <div class="profile-menu">
                    <a th:href="@{/profile}" class="profile-menu-item active">
                        <i class="bi bi-person"></i>
                        <span>Мой профиль</span>
                    </a>
                    <a th:href="@{/profile/orders}" class="profile-menu-item">
                        <i class="bi bi-box"></i>
                        <span>Мои заказы</span>
                    </a>
                    <a th:href="@{/profile/change-password}" class="profile-menu-item">
                        <i class="bi bi-key"></i>
                        <span>Сменить пароль</span>
                    </a>
                </div>

                <!-- Основная информация -->
                <div class="profile-content">
                    <div class="content-header">
                        <h2>📋 Личные данные</h2>
                        <a href="/profile/edit" class="edit-link">
                            <i class="bi bi-pencil"></i> Редактировать
                        </a>
                    </div>

                    <!-- Сообщения -->
                    <div th:if="${success}" class="alert alert-success">
                        <i class="bi bi-check-circle-fill"></i>
                        <span th:text="${success}"></span>
                    </div>
                    <div th:if="${error}" class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <!-- Таблица данных -->
                    <table class="info-table">
                        <tr>
                            <td>Имя</td>
                            <td th:text="${user.firstName}">Иван</td>
                        </tr>
                        <tr>
                            <td>Фамилия</td>
                            <td th:text="${user.lastName}">Иванов</td>
                        </tr>
                        <tr>
                            <td>Email</td>
                            <td th:text="${user.email}">ivan@mail.com</td>
                        </tr>
                        <tr>
                            <td>Телефон</td>
                            <td th:text="${user.phone != null ? user.phone : 'не указан'}">
                                +7 (999) 123-45-67
                            </td>
                        </tr>
                        <tr>
                            <td>Зарегистрирован</td>
                            <td th:text="${#temporals.format(user.registeredAt, 'dd.MM.yyyy')}">
                                01.01.2024
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
