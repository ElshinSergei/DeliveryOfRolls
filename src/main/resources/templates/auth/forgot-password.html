<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Восстановление пароля</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<main>

    <!-- Фон с падающими роллами -->
    <div class="sushi-bg">
        <div class="sushi-roll">🍣</div>
        <div class="sushi-roll">🍱</div>
        <div class="sushi-roll">🍘</div>
        <div class="sushi-roll">🍣</div>
        <div class="sushi-roll">🍱</div>
        <div class="sushi-roll">🍘</div>
        <div class="sushi-roll">🍣</div>
        <div class="sushi-roll">🍱</div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <!-- Логотип -->
            <a th:href="@{/home}" class="logo">
                <i class="bi bi-egg-fried"></i>
                <span>RedRolls</span>
            </a>

            <h2 class="auth-title">Восстановление пароля</h2>
            <p class="auth-subtitle">Введите email, мы отправим временный пароль</p>

            <!-- Форма -->
            <form th:action="@{/password/forgot}"
                  th:object="${forgotPasswordDTO}"
                  method="post"
                  class="auth-form">

                <div class="input-group">
                    <i class="bi bi-envelope"></i>
                    <input type="email"
                           th:field="*{email}"
                           placeholder="Email"
                           required>
                </div>
                <div th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}"
                     class="error-message"></div>

                <button type="submit" class="auth-btn">
                    <i class="bi bi-send"></i>
                    Отправить
                </button>
            </form>

            <!-- Ссылка назад -->
            <div class="auth-switch">
                <a th:href="@{/login}" class="auth-link">
                    <i class="bi bi-arrow-left"></i>
                    Вернуться ко входу
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
